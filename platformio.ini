; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
    knolleary/PubSubClient@^2.8
upload_port = COM5
upload_speed = 115200
monitor_speed = 115200

; Give each dome a stable fleet identity.
; Default: auto "dome-<chipId>" unique per MCU — no flag needed.
; Optional readable names for a managed fleet, one env per unit:
;
; [env:kitchen]
; extends = env:esp8266
; build_flags = -DSTATION_ID="kitchen"
;
; [env:workshop]
; extends = env:esp8266
; build_flags = -DSTATION_ID="workshop"
