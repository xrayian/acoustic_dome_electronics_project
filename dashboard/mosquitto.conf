# Local Mosquitto broker config for the Acoustic Dome noise monitor.
# Home / LAN only. The ESP8266 and the dashboard PC connect over the local network.

# Listen on all interfaces so the ESP8266 can reach the broker over WiFi.
listener 1883 0.0.0.0

# Open access for the home LAN. No credentials.
allow_anonymous true

# Keep messages in memory only (no persistence needed for live data).
persistence false

# Retained messages are allowed so the dashboard picks up the latest level on reconnect.
retained_available true

log_type error
log_type warning
log_type notice
log_type information